<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GVP Campus Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#667;--br:#dde2ee;--pr:#2f4fd0;--ok:#16883a;--no:#d32f2f;--okb:#e3f5e9;--nob:#fdeaea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151d;--card:#1c2130;--tx:#e8ebf4;--mu:#9aa3b8;--br:#2c3350;--pr:#7d96ff;--ok:#4cd07a;--no:#ff7b7b;--okb:#17301f;--nob:#3a1d1d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:14px 16px}header h1{margin:0;font-size:22px}header p{margin:2px 0 0;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--br);padding:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;border:0;background:none;color:var(--tx);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--pr);color:#fff}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:var(--okb);color:var(--ok)}.no{background:var(--nob);color:var(--no)}
button.b,.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}.b.g{background:var(--card);color:var(--tx);border:1px solid var(--br)}.b.r{background:var(--no)}.b:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.big{font-size:42px;text-align:center}
.msg{padding:10px;border-radius:8px;margin-bottom:10px}.price{font-weight:700;color:var(--pr)}.mu{color:var(--mu);font-size:13px}
.wide{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;border-bottom:1px solid var(--br);text-align:left;font-size:14px}
.sl{position:relative;height:50px;background:var(--okb);border:1px solid var(--ok);border-radius:99px;overflow:hidden;margin-top:8px}.sl input{position:relative;z-index:2;width:100%;height:50px;margin:0;padding:0;border:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}.sl input::-webkit-slider-runnable-track{height:50px;background:transparent}.sl input::-moz-range-track{height:50px;background:transparent}.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:64px;height:50px;border-radius:99px;background:var(--ok);border:0}.sl input::-moz-range-thumb{width:64px;height:50px;border-radius:99px;background:var(--ok);border:0}.sl span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:56px;color:var(--ok);font-weight:700;pointer-events:none}
</style></head><body>
<header><h1>GVP Campus Hub</h1><p>Know what's available before you visit.</p></header>
<nav id="nav"></nav><main id="app"><p>Loading…</p></main>
<script>
window.onerror=function(m,s,l){var a=document.getElementById('app');if(a)a.innerHTML='<div class="card"><b>Page error:</b> '+m+' (line '+l+')</div>'};window.addEventListener('unhandledrejection',function(e){var a=document.getElementById('app');if(a&&/Loading/.test(a.innerHTML))a.innerHTML='<div class="card"><b>Error:</b> '+(e.reason&&e.reason.message||e.reason)+'</div>'});setTimeout(function(){var a=document.getElementById('app');if(a&&/Loading/.test(a.innerHTML))a.innerHTML='<div class="card">Still loading… the server may be waking up. Refresh in a minute.</div>'},20000);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['Pending','Accepted','Preparing','Ready for Pickup','Completed','Rejected','Cancelled'], RS=['Submitted','Under Review','Approved','Rejected','Added to Catalogue'];
const CATS={canteen:['Breakfast','Meals','Snacks','Fast Food','Beverages','Tea and Coffee'],stationery:['Pens & Pencils','Notebooks','Records','Files & Folders','Drawing','Lab Materials','Other']};
const DEF={open:true,o:'08:00',c:'17:00',paused:false,prep:15,step:15,cutoff:15};
let db,me,isAdmin=false,uid='',tab='home',S={items:[],orders:[],reqs:[],stores:{}},cart={canteen:{},stationery:{}},flt={canteen:{q:'',c:''},stationery:{q:'',c:''}},note='',edit=null,ofl={s:'',q:''},toast='';
const store=k=>({...DEF,...(S.stores[k]||{})});
const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m}, fmt=m=>{const h=Math.floor(m/60)%24;return String(h).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dstr=d=>d.toISOString().slice(0,10).replace(/-/g,'-'), today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function isOpen(k){const s=store(k),n=new Date(),m=n.getHours()*60+n.getMinutes();return s.open&&m>=tm(s.o)&&m<tm(s.c)}
function slots(k,date){const s=store(k),n=new Date(),isT=date===today(),min=isT?n.getHours()*60+n.getMinutes()+ +s.prep:0,out=[];
 if(!s.open||s.paused)return out;
 for(let t=tm(s.o);t<=tm(s.c)-s.cutoff;t+=+s.step)if(t>=min&&t>=tm(s.o)+ +s.prep*0)out.push(fmt(t));return out}
function pill(ok,a,b){return `<span class="pill ${ok?'ok':'no'}">${ok?a:b}</span>`}
// When this page is hosted on Vercel, the data server lives on Render. Change this link if your Render link changes.
const API_BASE=/\.vercel\.app$/.test(location.hostname)?'https://gvp-campus-hub-on-1-render-com.onrender.com':'';
let TOKEN='';try{TOKEN=sessionStorage.getItem('gvptk')||''}catch(e){}const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};let MY=ld('gvpo'),MYR=ld('gvpr');
let LK=(()=>{try{return JSON.parse(localStorage.getItem('gvplk')||'{}')}catch(e){return{}}})();
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
async function api(m,p,b){const r=await fetch(API_BASE+'/api'+p,{method:m,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch{}if(r.status===401&&TOKEN){TOKEN='';authed=false;isAdmin=false;try{sessionStorage.removeItem('gvptk')}catch(e){}}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function myOrdersFetch(){let a=MY.length?await api('GET','/orders?ids='+MY.join(',')):[];
 if(LK.p&&LK.s){try{const b=await api('GET','/orders/lookup?phone='+encodeURIComponent(LK.p)+'&sid='+encodeURIComponent(LK.s)),seen=new Set(a.map(x=>x.id));b.forEach(x=>{if(!seen.has(x.id))a.push(x)})}catch(e){}}return a}
async function lookup(){const p=($('#lp').value||'').trim(),s=($('#ls').value||'').trim();LK={p,s};try{const b=await api('GET','/orders/lookup?phone='+encodeURIComponent(p)+'&sid='+encodeURIComponent(s));sv('gvplk',LK);toast='';note=b.length?'Found '+b.length+' order'+(b.length>1?'s':'')+'.':'No orders found for that phone number and ID.'}catch(e){LK={};toast=e.message}await load()}
async function load(){try{const s=await api('GET','/state');S.items=s.items;S.stores=s.stores;S.online=!!s.online;S.payee=s.payee||'';
 if(TOKEN){S.orders=await api('GET','/admin/orders');S.reqs=await api('GET','/admin/requests')}else{S.orders=await myOrdersFetch();S.reqs=MYR.length?await api('GET','/requests?ids='+MYR.join(',')):[]}}catch(e){toast=e.message}render();syncAlarm()}
function render(){
 const t=[['home','Home'],['canteen','Canteen'],['stationery','Stationery'],['orders','My Orders'],['request','Request an Item'],['admin','Admin']];
 $('#nav').innerHTML=t.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${k==='admin'&&!isAdmin?'Admin Login':l}</button>`).join('');
 const v={home,canteen:()=>shop('canteen'),stationery:()=>shop('stationery'),orders:myOrders,request:reqForm,admin}[tab]();
 const f=document.activeElement,id=f&&f.id,val=f&&f.value,pos=f&&f.selectionStart;
 $('#app').innerHTML=banner()+(toast?`<div class="msg no">${esc(toast)}</div>`:'')+(note?`<div class="msg ok">${esc(note)}</div>`:'')+v;
 if(id&&$('#'+id)){const e=$('#'+id);e.focus();try{e.setSelectionRange(pos,pos)}catch{}}}
function go(k){tab=k;note='';toast='';render();scrollTo(0,0)}
function home(){return ['canteen','stationery'].map(k=>{const s=store(k),n=S.items.filter(i=>i.store===k);
 return `<div class="card"><h2>${k==='canteen'?'🍽️ College Canteen':'✏️ Stationery Store'} ${pill(isOpen(k),'OPEN','CLOSED')}</h2>
 <p class="mu">Hours ${s.o} – ${s.c}${s.paused?' · New orders paused':''} · ${n.filter(i=>i.avail&&i.stock>0).length} of ${n.length} items in stock</p><button class="b" onclick="go('${k}')">${k==='canteen'?'Browse &amp; order':'View items'}</button></div>`}).join('')+
 `<div class="card mu">Status and stock update live for everyone. Orders are pre-orders; collect at your chosen time.</div>`}
function shop(k){const s=store(k),f=flt[k],c=cart[k],items=S.items.filter(i=>i.store===k&&(!f.c||i.cat===f.c)&&i.name.toLowerCase().includes(f.q.toLowerCase()));
 const lines=Object.entries(c).map(([id,q])=>[S.items.find(i=>i.id===id),q]).filter(x=>x[0]),tot=lines.reduce((a,[i,q])=>a+i.price*q,0);
 const dates=[today(),(d=>{d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(new Date())];
 const d0=flt[k].d||dates[0],sl=slots(k,d0);
 return `<h2>${k==='canteen'?'College Canteen':'Stationery Store'} ${pill(isOpen(k),'OPEN','CLOSED')}</h2><p class="mu">Hours ${s.o} – ${s.c}${s.paused?' · ⏸ New orders are paused':''}</p>
 <div class="row"><input id="q${k}" placeholder="Search items…" value="${esc(f.q)}" oninput="flt.${k}.q=this.value;render()"><select onchange="flt.${k}.c=this.value;render()"><option value="">All categories</option>${CATS[k].map(x=>`<option ${f.c===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="grid">${items.map(i=>{const ok=i.avail&&i.stock>0;return `<div class="card"><div class="big">${esc(i.img||'📦')}</div><b>${esc(i.name)}</b> <span class="mu">${esc(i.cat)}</span><div class="mu">${esc(i.desc)}</div>
 <div class="price">₹${i.price}</div><div>${pill(ok,'IN STOCK','OUT OF STOCK')} <span class="mu">${ok?i.stock+' left':''}</span></div>
 ${k==='canteen'?`<div class="row" style="margin-top:8px"><button class="b g" ${ok?'':'disabled'} onclick="add('${k}','${i.id}')">Add to Cart</button><button class="b" ${ok?'':'disabled'} onclick="add('${k}','${i.id}',1)">Order Now</button></div>`:''}</div>`}).join('')||'<div class="card mu">No items found. (Admins can load sample items from the Admin tab.)</div>'}</div>
 ${k!=='canteen'?'<div class="card mu">Stationery items are bought at the store counter. Online ordering is not available here — check the stock and prices, then visit the store.</div>':`<div class="card" id="cart${k}"><h3>🛒 Your cart</h3>${lines.length?lines.map(([i,q])=>`<div class="row"><span>${esc(i.name)} ₹${i.price}</span><span><button class="b g" onclick="qty('${k}','${i.id}',-1)">−</button> ${q} <button class="b g" onclick="qty('${k}','${i.id}',1)">+</button></span></div>`).join('')+`<h3>Total ₹${tot}</h3>
 <div class="row"><select onchange="flt.${k}.d=this.value;flt.${k}.t='';render()">${dates.map(d=>`<option ${d===d0?'selected':''}>${d}</option>`).join('')}</select>
 <select id="t${k}" onchange="flt.${k}.t=this.value">${sl.map(x=>`<option ${f.t===x?'selected':''}>${x}</option>`).join('')||'<option value="">No slots</option>'}</select></div>
 ${sl.length?'':`<div class="msg no">No pickup slots available for this day — the store may be closed, paused, or past its cut-off. Try another day.</div>`}
 <input id="n${k}" placeholder="Your name" value="${esc(f.n||'')}" oninput="flt.${k}.n=this.value"><input id="i${k}" placeholder="Student / staff ID" value="${esc(f.i||'')}" oninput="flt.${k}.i=this.value"><input id="p${k}" placeholder="Phone number (used to find your orders later)" value="${esc(f.p||'')}" oninput="flt.${k}.p=this.value">
 ${S.online?`<div class="msg ok">💳 Pay <b>₹${tot}</b> securely by UPI (PhonePe, Google Pay, Paytm), card or net banking. Your order is confirmed automatically after payment.</div>`:s.upi?`<div class="msg ok">💳 You will pay <b>₹${tot}</b> in a UPI app (PhonePe, Google Pay, Paytm…) after you tap the button.</div>`:'<div class="msg no">Online payment is not set up yet — you will pay at pickup.</div>'}
 <button class="b" ${sl.length?'':'disabled'} onclick="place('${k}')">${S.online?'Pay ₹'+tot:s.upi?'Pay ₹'+tot+' &amp; place order':'Place order'}</button>`:'<p class="mu">Your cart is empty.</p>'}</div>`}`}
function add(k,id,go_){const i=S.items.find(x=>x.id===id),c=cart[k];if((c[id]||0)>=i.stock){toast='Only '+i.stock+' available.';return render()}c[id]=(c[id]||0)+1;toast='';render();setTimeout(()=>$('#cart'+k)?.scrollIntoView({behavior:'smooth'}),50)}
function qty(k,id,d){const i=S.items.find(x=>x.id===id),n=(cart[k][id]||0)+d;if(n<=0)delete cart[k][id];else if(n<=i.stock)cart[k][id]=n;render()}
async function place(k){toast='';const f=flt[k],t=f.t||$('#t'+k).value;if(!f.n||!f.i)return(toast='Please enter your name and ID.',render());
 if(!/^\d{10,15}$/.test((f.p||'').replace(/\D/g,'')))return(toast='Please enter a valid phone number.',render());
 try{const r=await api('POST','/orders',{store:k,name:f.n,sid:f.i,phone:f.p||'',payMethod:S.online?'online':store(k).upi?'upi':'cash',date:f.d||today(),time:t,lines:Object.entries(cart[k]).map(([id,q])=>({id,q}))});MY.push(r.id);sv('gvpo',MY);cart[k]={};note=`Order placed! Your order ID is ${r.id}. Pickup ${r.date} at ${r.time}. Track it under My Orders.`;tab='orders';await load();if(r.online){note='Complete the payment to confirm your order.';render();await startCheckout(r.id);return}if(store(k).upi){note='Order placed! Complete the payment in your UPI app. Order ID '+r.id+'.';render();setTimeout(()=>payNow(r.id),600)}}catch(e){toast=e.message;render()}}
function myOrders(){const l=(TOKEN?S.orders.filter(o=>MY.includes(o.id)):S.orders).sort((a,b)=>b.at-a.at);
 return `<h2>My Orders</h2><div class="card"><b>Find my orders</b><div class="mu">Orders are saved on the server. Enter the phone number and ID you used to order and see them on any phone, any day.</div><input id="lp" placeholder="Phone number" value="${esc(LK.p||'')}"><input id="ls" placeholder="Student / staff ID" value="${esc(LK.s||'')}"><button class="b" onclick="lookup()">Show my orders</button></div>`+(l.map(o=>`<div class="card"><b>${o.id}</b> · ${o.store} · <span class="pill ${['Rejected','Cancelled'].includes(o.status)?'no':'ok'}">${o.status}</span><div class="mu">Pickup ${o.date} ${o.time}</div><div class="mu">Payment: ${o.payMethod==='upi'?'UPI':'Pay at pickup'} · <b>${o.payStatus||'Unpaid'}</b></div>${o.status==='Awaiting payment'?`<div class="row" style="margin:6px 0"><button class="b" onclick="startCheckout('${o.id}')">Pay ₹${o.total} now</button></div>`:''}${o.payMethod==='upi'&&o.payStatus==='Payment pending'?`<div class="row" style="margin:6px 0"><button class="b" onclick="payNow('${o.id}')">Pay ₹${o.total} with UPI app</button><button class="b g" onclick="paid('${o.id}')">I have paid</button></div>${window.qrcode?`<div style="background:#fff;display:inline-block;padding:8px;border-radius:8px;line-height:0">${qrImg(upiLink(o))}</div><div class="mu">Or scan this QR with any UPI app (PhonePe, Google Pay, Paytm) to pay ₹${o.total}.</div>`:''}`:''}${o.payStatus==='Awaiting verification'?'<div class="mu">⏳ Waiting for the canteen to confirm your payment.</div>':''}${o.payStatus==='Paid'?'<div class="mu">✅ Payment confirmed.</div>':''}<div>${o.lines.map(x=>`${esc(x.name)} ×${x.q}`).join(', ')}</div><b>₹${o.total}</b>
 ${['Pending','Awaiting payment'].includes(o.status)?`<div><button class="b r" onclick="setSt('${o.id}','Cancelled')">Cancel order</button></div>`:''}</div>`).join('')||'<div class="card mu">No orders from this device/account yet.</div>')}
function reqForm(){return `<h2>Request an Item</h2><div class="card"><p class="mu">Submitting a request does not guarantee the item will be purchased or made available.</p>
 <input id="rn" placeholder="Item name"><select id="rc"><option value="canteen">Canteen</option><option value="stationery">Stationery</option></select><input id="rq" placeholder="Quantity / expected requirement"><textarea id="rd" placeholder="Description (optional)"></textarea><input id="rp" placeholder="Your name"><input id="ri" placeholder="Student / staff ID"><button class="b" onclick="sendReq()">Submit request</button></div>
 <h3>My requests</h3>${S.reqs.filter(r=>MYR.includes(r.id)).map(r=>`<div class="card">${esc(r.name)} (${r.store}) — <b>${r.status}</b></div>`).join('')||'<p class="mu">None yet.</p>'}`}
async function sendReq(){const g=i=>$('#'+i).value.trim();try{const r=await api('POST','/requests',{name:g('rn'),store:g('rc'),qty:g('rq'),desc:g('rd'),by:g('rp'),sid:g('ri')});MYR.push(r.id);sv('gvpr',MYR);toast='';note='Request submitted. Thank you!';await load()}catch(e){toast=e.message;render()}}
async function setSt(id,st){try{await api('PATCH','/'+(TOKEN?'admin/':'')+'orders/'+id,{status:st});toast=''}catch(e){toast=e.message}await load()}
let authed=!!TOKEN;
async function login(){try{const r=await api('POST','/admin/login',{username:$('#au').value.trim(),password:$('#ap').value});TOKEN=r.token;try{sessionStorage.setItem('gvptk',TOKEN)}catch(e){};authed=isAdmin=true;toast='';note='Welcome, admin.';await load()}catch(e){toast=e.message;render()}}
function logout(){TOKEN='';try{sessionStorage.removeItem('gvptk')}catch(e){};authed=isAdmin=false;note='';S.orders=[];S.reqs=[];load()}
function admin(){
 if(!authed)return `<div class="card" style="max-width:380px;margin:auto"><h2>🔒 Admin Login</h2><input id="au" placeholder="Username" autocomplete="username"><input id="ap" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="b" onclick="login()">Log in</button><p class="mu">Only the administrator can change items, prices, stock, orders and store settings. Every admin action is verified on the server.</p></div>`;
 if(!isAdmin)return `<div class="card"><h2>Read-only</h2><p>Password accepted, but you're not signed in to claude.ai as the page owner/editor, so the database will reject admin changes. Sign in with the owner account.</p><button class="b g" onclick="logout()">Log out</button></div>`;
 const o=S.orders,n=(s)=>o.filter(x=>x.status===s).length,td=o.filter(x=>x.date===today()||new Date(x.at).toDateString()===new Date().toDateString());
 const low=S.items.filter(i=>i.stock<=(i.low??5));
 return `<h2>Admin Dashboard <button class="b g" onclick="logout()">Log out</button></h2>${(()=>{const pend=o.filter(x=>x.status==='Pending').sort((a,b)=>a.at-b.at);return pend.length?`<div class="card" style="border:2px solid var(--no)"><h3>🔔 ${pend.length} new order${pend.length>1?'s':''} <button class="b g" onclick="toggleMute()">${muted?'🔕 Sound off':'🔔 Sound on'}</button></h3>${AC&&AC.state==='running'?'':'<div class="msg no" style="cursor:pointer" onclick="audioInit();ring();render()">🔕 Tap here to turn on the order alarm sound</div>'}${pend.map(x=>`<div class="card"><b>${x.id}</b> · ${x.store} · ₹${x.total}<br>${esc(x.name)} (${esc(x.sid)}) · pickup ${x.date} ${x.time}<br>${x.lines.map(l=>esc(l.name)+' ×'+l.q).join(', ')}<div class="mu">Payment: ${x.payMethod==='upi'?'UPI':'Pay at pickup'} · ${x.payStatus||'Unpaid'}</div>${x.payMethod==='upi'&&x.payStatus!=='Paid'?`<button class="b" style="margin-top:8px" onclick="setPay('${x.id}','Paid')">✔ I received the payment</button>`:`<div class="sl"><input type="range" min="0" max="100" value="0" oninput="slide(this,'${x.id}')" onchange="slideEnd(this)"><span>Slide to accept ➜</span></div>`}</div>`).join('')}</div>`:''})()}<div class="grid">${[['Canteen items',S.items.filter(i=>i.store==='canteen').length],['Stationery items',S.items.filter(i=>i.store==='stationery').length],['Low / out of stock',low.length],['Pending orders',n('Pending')],['Accepted',n('Accepted')],['Completed',n('Completed')],["Today's orders",td.length+' · ₹'+td.reduce((a,x)=>a+x.total,0)]].map(([a,b])=>`<div class="card"><div class="mu">${a}</div><b style="font-size:22px">${b}</b></div>`).join('')}</div>
 ${['canteen','stationery'].map(k=>{const s=store(k);return `<div class="card"><h3>${k} settings ${pill(isOpen(k),'OPEN','CLOSED')}</h3><div class="row">
 <label><input type="checkbox" style="width:auto" ${s.open?'checked':''} onchange="ss('${k}','open',this.checked)"> Open <span class="mu">(if you close it by hand, it reopens automatically the next day)</span></label><label><input type="checkbox" style="width:auto" ${s.paused?'checked':''} onchange="ss('${k}','paused',this.checked)"> Pause new orders</label></div>
 <div class="row"><label>Opens<input type="time" value="${s.o}" onchange="ss('${k}','o',this.value)"></label><label>Closes<input type="time" value="${s.c}" onchange="ss('${k}','c',this.value)"></label><label>Prep (min)<input type="number" value="${s.prep}" onchange="ss('${k}','prep',+this.value)"></label><label>Slot gap (min)<input type="number" value="${s.step}" onchange="ss('${k}','step',+this.value)"></label><label>Cut-off before close (min)<input type="number" value="${s.cutoff}" onchange="ss('${k}','cutoff',+this.value)"></label>${k==='canteen'?`<label>UPI ID for payments<input value="${esc(s.upi||'')}" placeholder="name@bank" onchange="ss('${k}','upi',this.value.trim())"></label>`:''}</div></div>`}).join('')}
 <div class="card"><h3>${edit?.id?'Edit':'Add'} item</h3>${itemForm()}</div>
 <div class="card wide"><h3>Items ${S.items.length?'':`<button class="b g" onclick="seed()">Load sample items</button>`}</h3><table><tr><th>Item</th><th>Store</th><th>₹</th><th>Stock</th><th></th></tr>${S.items.map(i=>`<tr><td>${esc(i.img)} ${esc(i.name)}<br><span class="mu">${esc(i.cat)}${i.avail?'':' · unavailable'}</span></td><td>${i.store}</td><td>${i.price}</td><td style="color:${i.stock<=(i.low??5)?'var(--no)':'inherit'}">${i.stock}<br><button class="b g" onclick="stk('${i.id}',-1)">−</button><button class="b g" onclick="stk('${i.id}',1)">+</button></td><td><button class="b g" onclick="edit=S.items.find(x=>x.id=='${i.id}');render()">Edit</button> <button class="b r" onclick="del('${i.id}')">Del</button></td></tr>`).join('')}</table></div>
 <div class="card wide"><h3>Orders</h3><div class="row"><select onchange="ofl.s=this.value;render()"><option value="">All statuses</option>${ST.map(s=>`<option ${ofl.s===s?'selected':''}>${s}</option>`).join('')}</select><input id="oq" placeholder="Search order ID" value="${esc(ofl.q)}" oninput="ofl.q=this.value;render()"></div>
 <table>${[...o].sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)||b.at-a.at).filter(x=>(!ofl.s||x.status===ofl.s)&&x.id.toLowerCase().includes(ofl.q.toLowerCase())).map(x=>`<tr><td><b>${x.id}</b> ${x.status==='Pending'?'🟠':''}<br>${x.store} · ${esc(x.name)} (${esc(x.sid)}) ${esc(x.phone)}<br>${x.lines.map(l=>esc(l.name)+'×'+l.q).join(', ')} · ₹${x.total}<br>Pickup ${x.date} ${x.time}<br>💳 ${x.payMethod==='upi'?'UPI':'Pay at pickup'} · <b>${x.payStatus||'Unpaid'}</b> <select onchange="setPay('${x.id}',this.value)">${['Unpaid','Payment pending','Awaiting verification','Paid','Payment rejected'].map(p=>`<option ${x.payStatus===p?'selected':''}>${p}</option>`).join('')}</select></td><td><select onchange="setSt('${x.id}',this.value)">${ST.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td class="mu">No orders.</td></tr>'}</table></div>
 <div class="card wide"><h3>Item requests</h3><table>${S.reqs.sort((a,b)=>b.at-a.at).map(r=>`<tr><td><b>${esc(r.name)}</b> (${r.store}) ${esc(r.qty)}<br><span class="mu">${esc(r.desc)} — ${esc(r.by)} ${esc(r.sid)}</span></td><td><select onchange="rs('${r.id}',this.value)">${RS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><br><button class="b g" onclick="edit={store:'${r.store}',name:${esc(JSON.stringify(r.name))}.replace(/&quot;/g,''),_req:'${r.id}'};render()">Add to catalogue</button></td></tr>`).join('')||'<tr><td class="mu">No requests.</td></tr>'}</table></div>`}
function itemForm(){const e=edit||{store:'canteen'};return `<div class="row"><select id="fs" onchange="edit={...gi(),store:this.value};render()">${['canteen','stationery'].map(s=>`<option ${e.store===s?'selected':''}>${s}</option>`).join('')}</select><select id="fc">${CATS[e.store||'canteen'].map(c=>`<option ${e.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
 <input id="fn" placeholder="Name" value="${esc(e.name||'')}"><input id="fd" placeholder="Description" value="${esc(e.desc||'')}"><div class="row"><input id="fi" placeholder="Emoji image" value="${esc(e.img||'')}"><input id="fp" type="number" placeholder="Price ₹" value="${e.price??''}"><input id="fk" type="number" placeholder="Stock" value="${e.stock??''}"><input id="fl" type="number" placeholder="Low-stock alert" value="${e.low??5}"></div>
 <label><input type="checkbox" id="fa" style="width:auto" ${e.avail===false?'':'checked'}> Available</label> <button class="b" onclick="saveItem()">Save</button> ${edit?`<button class="b g" onclick="edit=null;render()">Cancel</button>`:''}`}
const gi=()=>({...edit,store:$('#fs').value,name:$('#fn').value,desc:$('#fd').value,img:$('#fi').value,price:$('#fp').value,stock:$('#fk').value,low:$('#fl').value});
async function saveItem(){const g=gi(),p=+g.price,k=+g.stock;if(!g.name||!(p>=0)||!(k>=0)||g.price===''||g.stock==='')return(toast='Name, a valid price and stock (≥0) are required.',render());
 const d={store:g.store,cat:$('#fc').value,name:g.name,desc:g.desc||'',img:g.img||'📦',price:p,stock:Math.floor(k),low:+g.low||0,avail:$('#fa').checked};
 try{if(edit?.id)await api('PUT','/admin/items/'+edit.id,d);else await api('POST','/admin/items',d);if(edit?._req)await rs(edit._req,'Added to Catalogue');edit=null;toast='';note='Item saved.'}catch(e){toast=e.message}await load()}
const ss=async(k,f,v)=>{try{await api('PUT','/admin/stores/'+k,{...store(k),[f]:v})}catch(e){toast=e.message}await load()};
const stk=async(id,d)=>{try{await api('POST','/admin/items/'+id+'/stock',{delta:d})}catch(e){toast=e.message}await load()};
const del=async id=>{if(confirm('Delete this item?')){try{await api('DELETE','/admin/items/'+id)}catch(e){toast=e.message}await load()}};
const rs=async(id,s)=>{try{await api('PATCH','/admin/requests/'+id,{status:s})}catch(e){toast=e.message}await load()};
const seed=async()=>{try{await api('POST','/admin/seed')}catch(e){toast=e.message}await load()};
function qrImg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();return q.createImgTag(4,0)}catch(e){return ''}}
function upiLink(o){const s=store(o.store);return 'upi://pay?pa='+encodeURIComponent(s.upi)+'&pn='+encodeURIComponent(S.payee||'GVP Canteen')+'&am='+Number(o.total).toFixed(2)+'&cu=INR&tn='+encodeURIComponent(o.id)+'&tr='+encodeURIComponent(o.id)}
function payNow(id){const o=S.orders.find(x=>x.id===id);if(o&&store(o.store).upi)location.href=upiLink(o);else{toast='UPI payment is not available.';render()}}
function loadRzp(){return new Promise((ok,no)=>{if(window.Razorpay)return ok();const s=document.createElement('script');s.src='https://checkout.razorpay.com/v1/checkout.js';s.onload=ok;s.onerror=()=>no(Error('Could not load the payment window. Check your internet.'));document.head.appendChild(s)})}
async function startCheckout(id){try{const d=await api('POST','/orders/'+id+'/pay-init');if(d.paid){toast='';note='Payment received. Your order is confirmed.';tab='orders';await load();return}
 await loadRzp();new Razorpay({key:d.key,amount:d.amount,currency:'INR',order_id:d.rzpOrder,name:'GVP Canteen',description:'Order '+id,theme:{color:'#2f4fd0'},
 handler:async r=>{try{const v=await api('POST','/orders/'+id+'/pay-verify',{payment_id:r.razorpay_payment_id,signature:r.razorpay_signature});toast='';note=v.status==='Accepted'?'Payment received! Your order '+id+' is confirmed.':'Payment received. Your order '+id+' is waiting for the canteen.'}catch(e){toast=e.message}tab='orders';await load()},
 modal:{ondismiss:()=>{toast='Payment not completed. Open My Orders and tap Pay now to try again.';tab='orders';render()}}}).open()}catch(e){toast=e.message;tab='orders';render()}}
async function paid(id){try{await api('PATCH','/orders/'+id+'/paid');toast='';note='Thanks! The canteen will confirm your payment.'}catch(e){toast=e.message}await load()}
let AC=null,alarmT=null,muted=false;
function audioInit(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tick(t,f,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.setValueAtTime(v,t+d-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}
function ring(){try{if(!AC||muted||AC.state!=='running')return;const t=AC.currentTime;[880,1175,880,1175].forEach((f,i)=>tick(t+i*0.22,f,0.2,0.9))}catch(e){}}
function syncAlarm(){const n=TOKEN?S.orders.filter(o=>o.status==='Pending').length:0;if(n&&!alarmT){ring();alarmT=setInterval(ring,2200)}else if(!n&&alarmT){clearInterval(alarmT);alarmT=null}}
function toggleMute(){muted=!muted;render()}
function banner(){if(!isAdmin||tab==='admin')return '';const n=S.orders.filter(o=>o.status==='Pending').length;return n?`<div class="msg no" style="cursor:pointer" onclick="go('admin')">🔔 ${n} new order${n>1?'s':''} waiting — tap to open</div>`:''}
function slide(el,id){if(+el.value>=96&&!el.disabled){el.disabled=true;setSt(id,'Accepted')}}
function slideEnd(el){if(+el.value<96)el.value=0}
document.addEventListener('pointerdown',audioInit);
const setPay=async(id,s)=>{try{await api('PATCH','/admin/orders/'+id+'/payment',{payStatus:s})}catch(e){toast=e.message}await load()};
isAdmin=!!TOKEN;load();setInterval(()=>{if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))load()},8000);
</script></body></html>
